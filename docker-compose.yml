services:
  mongodb:
    image: mongo:5.0
    restart: unless-stopped
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-polyglot}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-polyglot}

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - 5000:5000
    volumes:
      # multer writes uploads to disk and stores their absolute path in Mongo,
      # so this has to be persistent or existing records go dangling.
      - uploads:/backend/uploads
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://${MONGO_USER:-polyglot}:${MONGO_PASSWORD:-polyglot}@mongodb:27017
      # Host only, no scheme — the code prefixes http(s):// itself.
      - DOMAIN_APP_DEPLOY=${DOMAIN_APP_DEPLOY:-localhost:5000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - OPENAI_SECRET_KEY=${OPENAI_SECRET_KEY}
      - OPENAI_ENDPOINT=${OPENAI_ENDPOINT}
      - APIKEY=${APIKEY}
      - SECRETKEY=${SECRETKEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - TEST_MODE=${TEST_MODE:-false}

volumes:
  mongo-data:
  uploads:
