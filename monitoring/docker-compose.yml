# Observability stack for the Polyglot backend — a separate Coolify resource.
#
# Coolify settings:
#   Build pack      Docker Compose
#   Base Directory  /backend/monitoring
#   Compose file    docker-compose.yml
#   Domain          assign to the `grafana` service only
#
# Prometheus is intentionally NOT given a domain: it has no authentication of
# its own. Reach it through Grafana, or an SSH port-forward when debugging.
#
# NOTE ON CONFIG DELIVERY. Both services are BUILT from the repo rather than
# pulled, so their configuration is baked into the image. Do not "simplify" this
# back to `image:` plus a relative bind mount such as
#     ./grafana/provisioning:/etc/grafana/provisioning
# Under Coolify those paths may not resolve to the repo, and Docker then creates
# an empty directory and mounts it. The container starts healthy with no
# datasources and no dashboards, and nothing is logged. Only the named data
# volumes below are mounts, and neither carries configuration.
#
# Both services join the external `coolify` network so Prometheus can scrape the
# backend's metrics port and Traefik's metrics entrypoint over internal DNS.

services:
  prometheus:
    build:
      context: ./prometheus
      dockerfile: Dockerfile
    restart: always
    expose:
      - '9090'
    volumes:
      - prometheus-data:/prometheus
    environment:
      # Container name of the backend, whose :9091 is scraped. Coolify names
      # compose containers `<service>-<resource-uuid>`; find it with
      #   docker ps --format '{{.Names}}' | grep backend
      - BACKEND_METRICS_TARGET=${BACKEND_METRICS_TARGET}
      # Traefik's metrics entrypoint (see monitoring/README.md step 1).
      - TRAEFIK_METRICS_TARGET=${TRAEFIK_METRICS_TARGET:-coolify-proxy:8082}
    # Prometheus does not expand environment variables in its config, so the
    # baked-in file is a template rendered at start-up. sed and sh are both
    # present in the image; no extra tooling required.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        sed -e "s|__BACKEND_METRICS_TARGET__|$${BACKEND_METRICS_TARGET}|g" \
            -e "s|__TRAEFIK_METRICS_TARGET__|$${TRAEFIK_METRICS_TARGET}|g" \
            /etc/prometheus/prometheus.template.yml > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=15d \
          --web.listen-address=:9090
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - coolify

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - prometheus
    expose:
      - '3000'
    volumes:
      # Grafana's own state (SQLite, sessions). Contains no provisioning —
      # dashboards live under /etc/grafana/provisioning inside the image, so
      # this volume cannot mask them and image updates always take effect.
      - grafana-data:/var/lib/grafana
    environment:
      # Public URL Grafana is served from, used for generated links.
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # Belt and braces behind Cloudflare Access: no anonymous access, and no
      # self-service sign-up.
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      # Silence the phone-home and news feed on an internal instance.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - coolify

volumes:
  prometheus-data:
  grafana-data:

networks:
  coolify:
    external: true
