apiVersion: 1

providers:
  - name: polyglot
    orgId: 1
    folder: Polyglot
    type: file
    disableDeletion: false
    # Dashboards are provisioned read-only from the repo; edits made in the UI
    # are discarded on restart. Change the JSON in git instead.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
