apiVersion: 1

providers:
  - name: polyglot
    orgId: 1
    folder: Polyglot
    type: file
    disableDeletion: false
    # Dashboards are provisioned read-only from the repo; edits made in the UI
    # are discarded on restart. Change the JSON in git instead.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      # Dashboards sit in this same directory, so one COPY in the Dockerfile
      # captures provider config and dashboards together. Note /etc/grafana,
      # not /var/lib/grafana — the grafana-data volume is mounted at the latter
      # and would mask dashboards baked into the image.
      path: /etc/grafana/provisioning/dashboards
